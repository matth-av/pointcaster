# Pointreceiver native builds, plus the Unity package publish.
#
# Runs when src/pointreceiver/unity/package.json changes, so bumping the package
# version is what creates a new release.
#
# This builds for Windows and Android (cross-compiling).
#
# Needs secrets `registry_user`/`registry_password` to pull the dev image, and
# `unity_package_deploy_key`: an ssh key that can push to the package repo.

when:
  - event: push
    branch: qt
    path:
      include: ['src/pointreceiver/unity/package.json']
  - event: manual

labels:
  platform: windows/amd64

variables:
  # force powershell to fail when a single command fails
  - &strict_mode $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
  - &unity_package_remote git@github.com:matth-av/pointcaster-unity.git
  - &container_env
    POINTRECEIVER_BUILD_VOLUME: pointreceiver-ci-build
    # set the username and password for cr.pointcaster.net here
    REGISTRY_USER:
      from_secret: registry_user
    REGISTRY_PASSWORD:
      from_secret: registry_password
    # force process isolation over hyperv, because it fucking sucks
    DOCKER_RUN: 'docker run --rm --isolation=process -v "$($pwd.Path):C:\pointcaster" -v "$($env:POINTRECEIVER_BUILD_VOLUME):C:\pointcaster\build" cr.pointcaster.net/pointcaster-dev:latest'

steps:
  - name: prepare
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      # force pulls to be anonymous, that seems to work best with zot
      - $env:REGISTRY_PASSWORD | docker login cr.pointcaster.net --username $env:REGISTRY_USER --password-stdin
      - docker pull cr.pointcaster.net/pointcaster-dev:latest
      # reap orphaned containers from prior builds first
      - docker ps -aq --filter volume=$env:POINTRECEIVER_BUILD_VOLUME | ForEach-Object { docker rm --force $_ }
      # clear ACLs for any build volumes created on previous runs
      - docker run --rm --isolation=process --entrypoint powershell -v "$($env:POINTRECEIVER_BUILD_VOLUME):C:\vol" cr.pointcaster.net/pointcaster-dev:latest -NoProfile -Command 'icacls C:\vol /reset /T /C /Q > $null; exit 0'
      # and clear the volume itself
      # (we use volumes around the place not for caching, but because
      # otherwise windows builds are painfully slow cause docker for 
      # windows is terrible).
      - docker volume rm --force $env:POINTRECEIVER_BUILD_VOLUME

  # ----- windows x86_64

  - name: configure-windows
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --preset pointreceiver-windows-release"

  - name: build-windows
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --build build/pointreceiver-windows-release"

  # build/ is a named volume, so the install has to land in the workspace itself
  # for the steps outside the container to see it
  - name: install-windows
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --install build/pointreceiver-windows-release --prefix C:/pointcaster/dist/pointreceiver-windows-install"

  - name: stage-windows
    image: pwsh
    commands:
      - *strict_mode
      - ./scripts/stage-unity-package.ps1 -InstallDir dist/pointreceiver-windows-install -Platform Windows -Arch x86_64

  # ----- android armeabi-v7a

  - name: configure-android
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --preset pointreceiver-android-armeabi-v7a"

  - name: build-android
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --build build/pointreceiver-android-armeabi-v7a"

  - name: install-android
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --install build/pointreceiver-android-armeabi-v7a --prefix C:/pointcaster/dist/pointreceiver-android-install"

  - name: stage-android
    image: pwsh
    commands:
      - *strict_mode
      - ./scripts/stage-unity-package.ps1 -InstallDir dist/pointreceiver-android-install -Platform Android -Arch armeabi-v7a

  # ----- android arm64-v8a

  - name: configure-android-arm64
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --preset pointreceiver-android-arm64-v8a"

  - name: build-android-arm64
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --build build/pointreceiver-android-arm64-v8a"

  - name: install-android-arm64
    image: pwsh
    environment: *container_env
    commands:
      - *strict_mode
      - Invoke-Expression "$env:DOCKER_RUN cmake --install build/pointreceiver-android-arm64-v8a --prefix C:/pointcaster/dist/pointreceiver-android-arm64-install"

  - name: stage-android-arm64
    image: pwsh
    commands:
      - *strict_mode
      - ./scripts/stage-unity-package.ps1 -InstallDir dist/pointreceiver-android-arm64-install -Platform Android -Arch arm64-v8a


  - name: publish-package
    image: pwsh
    environment:
      UNITY_PACKAGE_REMOTE: *unity_package_remote
      UNITY_PACKAGE_DEPLOY_KEY:
        from_secret: unity_package_deploy_key
    commands:
      - *strict_mode
      - ./scripts/publish-unity-package.ps1 -Remote $env:UNITY_PACKAGE_REMOTE -Plugins Windows/x86_64,Android/armeabi-v7a,Android/arm64-v8a
